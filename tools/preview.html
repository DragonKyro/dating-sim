<!doctype html>
<!-- Dev-only art preview. Examples:
       tools/preview.html?scene=ferry&time=golden
       tools/preview.html?scene=bakery&weather=blackout&char=rosie&expr=happy
       tools/preview.html?sheet=rosie        (every expression in a grid)
     Used by tools/shoot.mjs for headless screenshots. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Art preview</title>
  <link rel="stylesheet" href="../css/art.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #1a1320; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
    #stage { position: absolute; inset: 0; }
    #char { position: absolute; left: 50%; bottom: 0; height: 92%; aspect-ratio: 500 / 800; transform: translateX(-50%); }
    #sheet { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; height: 100%; box-sizing: border-box; }
    #sheet figure { margin: 0; position: relative; background: #3a3148; overflow: hidden; }
    #sheet figure div { position: absolute; inset: 0 0 18px 0; }
    #sheet figcaption { position: absolute; bottom: 0; width: 100%; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    const q = new URLSearchParams(location.search);
    const kit = await import("../js/art/kit.js");
    const stage = document.getElementById("stage");
    if (q.get("still")) document.documentElement.classList.add("reduce-motion");

    if (q.get("scene")) {
      const id = q.get("scene");
      const mod = await import(`../js/art/scenes/${id}.js`);
      const time = q.get("time") ?? "day";
      const pal = kit.palette(time);
      const parts = mod[id]({ pal, time, weather: q.get("weather") ?? "clear" });
      parts.push(kit.ambient(pal));
      stage.innerHTML = kit.svgFrame(parts);
    }
    if (q.get("char") || q.get("sheet")) {
      const { createCharacter, EXPRESSIONS } = await import("../js/art/character.js");
      const id = q.get("char") ?? q.get("sheet");
      const look = (await (await fetch(`../characters/${id}.json`)).json()).look;
      if (q.get("sheet")) {
        stage.innerHTML = `<div id="sheet"></div>`;
        const sheet = stage.firstChild;
        for (const e of EXPRESSIONS) {
          const fig = document.createElement("figure");
          fig.innerHTML = `<div></div><figcaption>${e}</figcaption>`;
          const c = createCharacter(look, { expression: e, idle: false, crop: q.get("crop") ?? "face" });
          fig.firstChild.appendChild(c.el);
          sheet.appendChild(fig);
        }
      } else {
        const holder = document.createElement("div");
        holder.id = "char";
        stage.appendChild(holder);
        const c = createCharacter(look, { expression: q.get("expr") ?? "neutral", outfit: q.get("outfit") ?? undefined });
        holder.appendChild(c.el);
        if (q.get("talk")) c.talk(true);
      }
    }
    document.body.dataset.ready = "1";
  </script>
</body>
</html>
